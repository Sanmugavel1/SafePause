<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SafePause - demo stage</title>
<style>
  html, body { margin: 0; height: 100%; background: #12171c; font-family: "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
  .top { height: 96px; display: flex; align-items: center; gap: 18px; padding: 0 18px; box-sizing: border-box; border-bottom: 1px solid #263039; }
  .brand { color: #d9ff43; font-weight: 700; font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
  .brand small { display: block; color: #8796a3; font-weight: 500; font-size: 12px; letter-spacing: 0; }
  .cap { flex: 1; color: #fff; min-width: 0; }
  .cap .t { font-size: 22px; font-weight: 600; line-height: 1.25; }
  .cap .s { font-size: 15px; color: #b9c4ce; margin-top: 3px; }
  .cap .step { color: #d9ff43; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; max-width: 430px; justify-content: flex-end; }
  .btns button { background: #1f2a33; color: #e6ecf1; border: 1px solid #3a4854; border-radius: 6px; padding: 7px 11px; font-size: 13px; cursor: pointer; }
  .btns button.main { background: #d9ff43; color: #12171c; border-color: #d9ff43; font-weight: 600; }
  .stage { display: grid; grid-template-columns: 384px 384px 1fr; grid-template-rows: 1fr 196px; gap: 8px; padding: 8px; height: calc(100vh - 96px); box-sizing: border-box; }
  .pane { background: #e9ecef; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 2px solid transparent; transition: border-color .3s, box-shadow .3s; }
  .pane.focus { border-color: #d9ff43; box-shadow: 0 0 0 3px rgba(217,255,67,.25); }
  .pane h3 { margin: 0; padding: 6px 12px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #cfd6dc; background: #2a3138; font-weight: 600; }
  iframe { border: 0; flex: 1; width: 100%; }
  .wide { grid-column: 1 / 4; }
  body.clean .btns button:not(.keep) { display: none; }
</style>
</head>
<body>
<div class="top">
  <div class="brand">SafePause<small>live prototype</small></div>
  <div class="cap"><div class="step" id="step">Demo</div><div class="t" id="capt">Pick a scenario to play</div><div class="s" id="caps">Everything below is the real running system: app, scoring, alerts, officer console.</div></div>
  <div class="btns">
    <button class="main" onclick="play('arrest')">&#9654; Digital arrest</button>
    <button onclick="play('invest')">&#9654; Fake investment</button>
    <button onclick="play('genuine')">&#9654; Genuine payments</button>
    <button onclick="play('all')">&#9654; Full video run</button>
    <button onclick="resetAll()">Reset</button>
    <button onclick="window.open('dashboard.html')">Dashboard</button>
  </div>
</div>
<div class="stage">
  <div class="pane" id="p-app"><h3 id="h-app">1 &middot; Customer's bank app</h3><iframe id="f-app" src="app.html?c=1&stage=1"></iframe></div>
  <div class="pane" id="p-con"><h3 id="h-con">2 &middot; Son's phone (trusted contact)</h3><iframe id="f-con" src="contact.html?stage=1"></iframe></div>
  <div class="pane" id="p-off"><h3>3 &middot; Bank officer console</h3><iframe id="f-off" src="officer.html"></iframe></div>
  <div class="pane wide" id="p-pipe"><h3>4 &middot; SafePause pipeline, live</h3><iframe id="f-pipe" src="pipeline.html"></iframe></div>
</div>
<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = id => $(id).contentWindow;
let RUN = 0;
function cap(step, t, s, focus = []) {
  $("step").innerHTML = step; $("capt").innerHTML = t; $("caps").innerHTML = s || "";
  ["p-app", "p-con", "p-off", "p-pipe"].forEach(p => $(p).classList.toggle("focus", focus.includes(p)));
}
async function post(path, body) {
  return (await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })).json();
}
const state = async () => (await fetch("/api/state")).json();
async function latestAlert() { const s = await state(); return s.alerts[0]; }
async function latestPay() { const s = await state(); return s.payments[0]; }
async function resetAll() { RUN++; await post("/api/reset"); W("f-app").setCust(1); W("f-app").setCall(false); cap("Demo", "Pick a scenario to play", ""); }

const SCN = {
  async arrest(r) {
    W("f-app").setCust(1); W("f-app").setCall(false); $("h-app").innerHTML = "1 &middot; Kamala's bank app";
    $("h-con").innerHTML = "2 &middot; Son's phone (trusted contact)";
    cap("Digital arrest &middot; 1/8", "Kamala, 74, Chennai. For two days, \"CBI officers\" have kept her on a call.",
        "Yesterday they made her close her &#8377;18 lakh fixed deposit. It is now in her savings account.", ["p-app"]); await sleep(12000);
    if (r !== RUN) return;
    W("f-app").go("safety");
    cap("Digital arrest &middot; 2/8", "When she opened her account, Kamala added her son Arun as a trusted contact.",
        "He never sees her balance. He is only asked when a payment looks like a scam.", ["p-app"]); await sleep(5500);
    if (r !== RUN) return;
    cap("Digital arrest &middot; 3/8", "Still on the call, she is told to move &#8377;4.8 lakh to an \"RBI safe custody account\".",
        "The account details arrive on WhatsApp. She pastes them and confirms with her PIN.", ["p-app"]);
    await W("f-app").autoPay("scam1", 2500); await sleep(800);
    if (r !== RUN) return;
    cap("Digital arrest &middot; 4/8", "SafePause scores the payment in about 25 ms. It is risky, so it is paused.",
        "Her screen only says <b>processing</b>. The scammer listening on the call hears nothing unusual.", ["p-app", "p-pipe"]); await sleep(11000);
    if (r !== RUN) return;
    cap("Digital arrest &middot; 5/8", "Arun gets a message: do you know about this payment?",
        "He does not. He taps <b>No. Stop it</b>.", ["p-con"]); await sleep(5500);
    const a = await latestAlert(); if (a) await W("f-con").reply(a.id, "not_expected"); await sleep(3500);
    if (r !== RUN) return;
    cap("Digital arrest &middot; 6/8", "The case moves to a bank officer, with the reasons in plain words.",
        "Big amount to a new account, on a call with an unknown number, details pasted. The receiving account is 11 days old.", ["p-off"]); await sleep(8000);
    { const q = await latestPay(); await post("/api/call", { payment_id: q.id }); }
    cap("Digital arrest &middot; 6/8", "The officer calls Kamala on her registered number.",
        "She says it is for \"case verification\". That does not match a payee called \"RBI Safe Custody Acct\".", ["p-off"]); await sleep(9000);
    if (r !== RUN) return;
    const p = await latestPay();
    await post("/api/officer", { payment_id: p.id, action: "stop", note: "Customer says a 'CBI officer' is on a video call. Payee name does not fit her reason." });
    cap("Digital arrest &middot; 7/8", "The officer stops it. &#8377;4.8 lakh is back in Kamala's account.",
        "The receiving account goes on the bank's risk list, and a report is ready for 1930 / NCRP.", ["p-app", "p-off", "p-pipe"]); await sleep(6500);
    if (r !== RUN) return;
    W("f-app").go("home"); await sleep(800);
    cap("Digital arrest &middot; 8/8", "The scammers try again with a different account.",
        "This time the payment goes straight to an officer hold.", ["p-app", "p-pipe"]);
    await W("f-app").autoPay("scam2", 600); await sleep(2500);
  },
  async invest(r) {
    await post("/api/reset"); W("f-app").setCust(2); W("f-app").setCall(false); $("h-app").innerHTML = "1 &middot; Rahul's bank app";
    $("h-con").innerHTML = "2 &middot; Trusted contact (Rahul has none)";
    cap("Fake investment &middot; 1/4", "Rahul, 29, joined a WhatsApp \"stock tips\" group. No phone call this time.",
        "To build trust, the group sends him a &#8377;1,200 \"profit\" from an unknown account.", ["p-app"]);
    await post("/api/credit", { customer_id: 2, amount: 1200, label: "\"IPO profit\"" }); await sleep(10000);
    if (r !== RUN) return;
    cap("Fake investment &middot; 2/4", "Now they ask for &#8377;10,000 to \"book an IPO allotment\".",
        "He pastes the account details they sent.", ["p-app"]);
    await W("f-app").autoPay("invest1", 1200); await sleep(600);
    if (r !== RUN) return;
    cap("Fake investment &middot; 3/4", "Small amount, but the pattern is clear: money from a stranger, then a first payment to a new account.",
        "Rahul has no trusted contact, so the officer gets it directly.", ["p-off", "p-pipe"]); await sleep(9500);
    if (r !== RUN) return;
    const p = await latestPay();
    await post("/api/officer", { payment_id: p.id, action: "stop", note: "Customer confirms WhatsApp 'IPO group'. Told him about the scam." });
    cap("Fake investment &middot; 4/4", "Stopped at the first payment, before it grows to lakhs.",
        "In real cases like this, victims keep paying bigger amounts for weeks.", ["p-app", "p-off"]); await sleep(6000);
  },
  async genuine(r) {
    await post("/api/reset"); W("f-app").setCust(2); W("f-app").setCall(false); $("h-app").innerHTML = "1 &middot; Rahul's bank app";
    cap("Genuine payments &middot; 1/2", "Rahul books a new bike: &#8377;45,000 to a dealer he has never paid before.",
        "Big, and to a new account. A blanket rule would delay it.", ["p-app"]);
    await W("f-app").autoPay("genuine", 800); await sleep(800);
    if (r !== RUN) return;
    cap("Genuine payments &middot; 2/2", "Paid at once. No pause, no pop-up.",
        "In our simulation, 99.5% of genuine payments never notice SafePause.", ["p-app", "p-pipe"]); await sleep(5000);
  },
};
async function play(name) {
  const r = ++RUN;
  if (name !== "invest" && name !== "genuine") await post("/api/reset");
  await sleep(1200);
  if (name === "all") {
    await SCN.arrest(r); if (r !== RUN) return;
    await SCN.invest(r); if (r !== RUN) return;
    await SCN.genuine(r); if (r !== RUN) return;
    cap("SafePause", "Pause only the risky payments. Don't tip off the scammer. Let a person decide.",
        "Prototype: Python + SQLite, same model as our simulation. 83% of scam money stopped, 0.48% of genuine payments delayed (synthetic data).", []);
  } else await SCN[name](r);
}
if (new URLSearchParams(location.search).get("autoplay")) setTimeout(() => play(new URLSearchParams(location.search).get("autoplay")), 2500);
</script>
</body>
</html>
